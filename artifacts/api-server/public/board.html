<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Discussion Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('scribe-theme')||'light')</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --b-bg:       #f5f0e8;
    --b-tile:     #faf7f2;
    --b-char:     #1a1410;
    --b-grid:     #d4c4a8;
    --b-lo:       rgba(0,0,0,0.08);
    --b-hi:       rgba(255,255,255,0.8);
    --b-split:    rgba(0,0,0,0.12);
    --b-mid:      #e8dfc8;
    --b-shadow:   0 4px 24px rgba(0,0,0,0.15);
    --b-inset:    rgba(0,0,0,0.06);
    --b-title:    #4a4038;
    --b-status:   #a09070;
    --b-prompt:   #7a6040;
    --b-arrow:    #b07010;
  }
  html[data-theme="dark"] {
    --b-bg:       #0d0d0b;
    --b-tile:     #141412;
    --b-char:     #f0b429;
    --b-grid:     #060604;
    --b-lo:       rgba(0,0,0,0.6);
    --b-hi:       rgba(255,255,255,0.03);
    --b-split:    rgba(0,0,0,0.8);
    --b-mid:      #0a0a08;
    --b-shadow:   0 12px 64px rgba(0,0,0,0.7);
    --b-inset:    rgba(240,180,41,0.1);
    --b-title:    #555550;
    --b-status:   #3a3a36;
    --b-prompt:   #666660;
    --b-arrow:    #f0b429;
  }

  body {
    background: var(--b-bg);
    color: var(--b-char);
    font-family: 'Space Mono', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  #unlock-overlay {
    position: fixed;
    inset: 0;
    background: var(--b-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    z-index: 1000;
    cursor: pointer;
  }
  #unlock-overlay h2 {
    font-size: 1rem;
    color: var(--b-arrow);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  #unlock-overlay p {
    color: var(--b-status);
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  #board-wrap {
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
    width: 100%;
  }

  #board-title {
    font-size: 0.6rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--b-title);
    text-align: center;
  }

  /* ── Flip board ─────────────────────── */
  #flip-board {
    display: grid;
    grid-template-columns: repeat(22, 1fr);
    gap: 3px;
    background: var(--b-grid);
    padding: 8px;
    border-radius: 3px;
    box-shadow: var(--b-shadow), inset 0 0 0 1px var(--b-inset);
    width: 100%;
    max-width: 900px;
  }

  .tile {
    aspect-ratio: 0.65;
    background: var(--b-tile);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.7rem, 2.2vw, 1.3rem);
    font-weight: 700;
    color: var(--b-char);
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 -1px 0 var(--b-lo), inset 0 1px 0 var(--b-hi);
  }

  /* Horizontal split line — the signature Vestaboard detail */
  .tile::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: var(--b-split);
    pointer-events: none;
  }

  .tile.flipping {
    animation: flip 0.18s ease-in-out;
  }

  @keyframes flip {
    0%   { transform: scaleY(1); }
    50%  { transform: scaleY(0); background: var(--b-mid); }
    100% { transform: scaleY(1); }
  }

  /* ── Prompts ────────────────────────── */
  #prompts-area {
    text-align: center;
    min-height: 5rem;
    max-width: 700px;
    width: 100%;
  }

  .prompt-item {
    font-size: clamp(0.72rem, 1.6vw, 0.95rem);
    color: #666660;
    line-height: 1.7;
    padding: 0.35rem 0;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    letter-spacing: 0.04em;
  }
  .prompt-item.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .prompt-item::before {
    content: '→ ';
    color: #f0b429;
  }

  /* ── Status ─────────────────────────── */
  #board-status {
    font-size: 0.58rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #3a3a36;
    text-align: center;
  }
</style>
</head>
<body>

<div id="unlock-overlay">
  <h2>Split-Flap Board</h2>
  <p>Click anywhere to enable audio</p>
</div>

<div id="board-wrap">
  <div id="board-title">SCRIBE PILOT · DISCUSSION BOARD</div>

  <div id="flip-board"></div>

  <div id="prompts-area"></div>
  <div id="board-status">Waiting for facilitator…</div>
</div>

<button id="theme-toggle" onclick="_toggleTheme()">☾ Dark</button>

<script>
// ── Theme toggle ──────────────────────────────
window._toggleTheme = function() {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('scribe-theme', next);
  var btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = next === 'dark' ? '☀ Light' : '☾ Dark';
};
(function() {
  var t = document.documentElement.getAttribute('data-theme') || 'light';
  var btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = t === 'dark' ? '☀ Light' : '☾ Dark';
})();
</script>

<script>
(function() {
  const ROWS = 6;
  const COLS = 22;
  const CHARSET = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,?!-:/\'';
  const FLIP_DELAY_PER_COL = 35; // ms stagger between columns
  const FLIPS_PER_TILE = 6;      // how many random chars before settling
  const FLIP_DURATION = 180;     // ms per flip animation

  let audioCtx = null;
  let audioUnlocked = false;

  // ── Unlock audio on click ──────────────────
  const overlay = document.getElementById('unlock-overlay');
  overlay.addEventListener('click', () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioUnlocked = true;
    overlay.style.transition = 'opacity 0.5s';
    overlay.style.opacity = '0';
    setTimeout(() => overlay.remove(), 500);
  });

  // ── Build the tile grid ────────────────────
  const board = document.getElementById('flip-board');
  const tiles = [];

  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = ' ';
      board.appendChild(tile);
      row.push(tile);
    }
    tiles.push(row);
  }

  // ── Sound synthesis ────────────────────────
  function playClick() {
    if (!audioUnlocked || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(220 + Math.random() * 440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.05);
    } catch {}
  }

  // ── Flip a single tile ─────────────────────
  function flipTile(tile, targetChar, delay) {
    return new Promise((resolve) => {
      setTimeout(() => {
        let flipsLeft = FLIPS_PER_TILE;

        function nextFlip() {
          tile.classList.remove('flipping');
          void tile.offsetHeight; // reflow
          tile.classList.add('flipping');
          playClick();

          flipsLeft--;
          if (flipsLeft > 0) {
            tile.textContent = CHARSET[Math.floor(Math.random() * CHARSET.length)];
            setTimeout(nextFlip, FLIP_DURATION);
          } else {
            tile.textContent = targetChar;
            tile.classList.remove('flipping');
            resolve();
          }
        }
        nextFlip();
      }, delay);
    });
  }

  // ── Reveal text on board ───────────────────
  function reveal(text, prompts) {
    document.getElementById('board-status').textContent = '';

    // Word-wrap text into rows of COLS
    const words = text.toUpperCase().split(/\s+/);
    const rows = [];
    let currentRow = '';
    for (const word of words) {
      const candidate = currentRow ? currentRow + ' ' + word : word;
      if (candidate.length <= COLS) {
        currentRow = candidate;
      } else {
        rows.push(currentRow);
        currentRow = word;
      }
    }
    if (currentRow) rows.push(currentRow);

    // Pad/truncate to ROWS rows, each padded to COLS
    const paddedRows = [];
    for (let r = 0; r < ROWS; r++) {
      const row = (rows[r] ?? '').padEnd(COLS, ' ').slice(0, COLS);
      paddedRows.push(row);
    }

    // Center each row
    const centeredRows = paddedRows.map(row => {
      const trimmed = row.trimEnd();
      const pad = Math.floor((COLS - trimmed.length) / 2);
      return (' '.repeat(pad) + trimmed).padEnd(COLS, ' ');
    });

    const flipPromises = [];

    // Column-staggered flip
    for (let c = 0; c < COLS; c++) {
      const colDelay = c * FLIP_DELAY_PER_COL;
      for (let r = 0; r < ROWS; r++) {
        const targetChar = centeredRows[r][c] ?? ' ';
        flipPromises.push(flipTile(tiles[r][c], targetChar, colDelay));
      }
    }

    // Show prompts after flip settles
    const maxDelay = COLS * FLIP_DELAY_PER_COL + FLIPS_PER_TILE * FLIP_DURATION;
    setTimeout(() => {
      showPrompts(prompts || []);
    }, maxDelay + 300);
  }

  function showPrompts(prompts) {
    const area = document.getElementById('prompts-area');
    area.innerHTML = '';
    prompts.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'prompt-item';
      div.textContent = p;
      area.appendChild(div);
      setTimeout(() => div.classList.add('visible'), i * 200 + 100);
    });
  }

  // ── Clear board ─────────────────────────────
  function clearBoard() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        tiles[r][c].textContent = ' ';
        tiles[r][c].classList.remove('flipping');
      }
    }
    document.getElementById('prompts-area').innerHTML = '';
  }

  // ── WebSocket ────────────────────────────────
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const base  = location.pathname.replace(/\/[^/]*$/, '');
    const ws    = new WebSocket(`${proto}//${location.host}${base}/ws?role=board`);

    ws.addEventListener('open', () => {
      document.getElementById('board-status').textContent = 'connected · waiting for facilitator…';
    });

    ws.addEventListener('message', (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'reveal') {
          clearBoard();
          reveal(msg.text, msg.prompts);
        }
      } catch {}
    });

    ws.addEventListener('close', () => {
      document.getElementById('board-status').textContent = 'reconnecting…';
      setTimeout(connect, 2000);
    });
  }

  connect();
})();
</script>
</body>
</html>
