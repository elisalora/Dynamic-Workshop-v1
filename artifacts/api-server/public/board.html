<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Discussion Board</title>
<!-- No Google Fonts link. The faces are in ./fonts and declared in
     workshop.css. A CDN request from a display standing in a private
     workshop sends a referrer, which is a third-party log of when that
     workshop was running. -->
<link rel="stylesheet" href="./workshop.css"/>
<style>
  /* ============================================================
     The board is the one surface a whole room looks at, in the
     dark, from the back wall. Everything here follows from that:

     - It is always dark. There is no theme toggle. A projected
       board has one lighting condition, and the toggle that used
       to sit here rendered as a raw browser button (Arial,
       rgb(239,239,239), 2px outset) in the middle of a projection.
     - Nothing is sized in rem. Every dimension derives from
       --board-w, which derives from the viewport, so the board is
       the same fraction of a laptop screen and a 4K projector.
       The old rule was `clamp(0.7rem, 2.2vw, 1.3rem)`, whose 1.3rem
       ceiling saturated above ~945px wide — so every projector,
       at any resolution, drew 20.8px letters.
     - Contrast is budgeted, not chosen. The old prompts measured
       3.37:1 on the dark ground and the status line 1.70:1, which
       is where the connection errors print.
     ============================================================ */

  .ws.ws-stage {
    /* Grid geometry. ONE declaration, read by CSS and by the script below
       through getComputedStyle — not two constants that agree today.

       3 rows x 15 columns is the **Vestaboard Note**, a real product:
       https://www.vestaboard.com/help/dimensions-note

       It is also exactly what artifacts/api-server/src/board-format.ts
       declares, so the seam this pass raised is now closed: the module that
       formats a topic and the display that draws it agree, rather than each
       being right on its own. That module asks the model for 32 characters
       or fewer, verifies with fitsOnBoard(), allows one rewrite, and then
       DROPS a topic that still will not fit rather than cutting it down — so
       nothing longer than this grid can ever arrive, and a larger display
       would have had rows that could never light up.

       IF A PHYSICAL BOARD IS EVER BOUGHT: the flagship Vestaboard is 6 x 22.
       Changing these two numbers is the whole display change — everything
       here derives from them, and the guard proves the layout at 3x15, 4x18
       and 6x22. BOARD_ROWS / BOARD_COLS in board-format.ts must move in the
       same commit, or the generator and the board disagree again. */
    --cols: 15;
    --rows: 3;

    --tile-ar: 0.65;                 /* w/h of one flap */

    /* THE PLATE IS SIZED AGAINST WHAT IS LEFT, AND THE FURNITURE NO LONGER
       SCALES WITH THE TILE.

       Everything outside the plate -- masthead, the gap under it, up to three
       prompts, the footer -- is set in viewport units below, so --chrome is a
       height and not a multiple of --cell. That is the fix for a real
       regression: when the grid went from 6x22 to 3x15 the tile got bigger,
       the furniture got bigger with it, and the plate was squeezed from 64%
       of the screen down to 59% -- the grid change made the headline bigger
       and the board smaller at the same time.

       Two versions of this were wrong before this one. A flat vh constant
       tuned by hand against 6x22 pushed the prompts off the bottom the moment
       the geometry changed. Expressing the furniture as a count of tiles
       fixed that and introduced this. A height that does not mention the grid
       at all is the thing that is true for both.

       The value is measured off a render, not guessed. 28vh was the first
       measurement and it was 2vh short: the furniture's clamps hit their
       minimums on a small viewport, so the chrome is proportionally TALLER
       in vh terms there, and 6x22 overflowed a 1080p screen by 21px while
       3x15 fitted. A height budget has to clear its worst case, which is the
       smallest display and the tallest grid, not the one in front of you.
       check_board_layout.py re-measures it at five display sizes, three grid
       geometries and four prompt counts. */
    --chrome: 32vh;

    /* As wide as the plate can be in the space left over, capped at 94vw.
       The var() fallbacks at the use sites cover a browser without CSS
       Values 4 division (pre Chrome 111 / Safari 16.4). */
    --ar: calc(var(--cols) * var(--tile-ar) / var(--rows));
    --board-w: min(94vw, calc((100vh - var(--chrome)) * var(--ar)));
    --cell: calc(var(--board-w) / var(--cols));
    --gap: calc(var(--cell) * 0.06);

    margin: 0;
    background: var(--xdark);
    color: var(--on-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  /* ── Masthead ───────────────────────────────────
     Deadpan institutional: the plate below announces what one table
     of eight said about sign-off, and the furniture around it is a
     departures board. The joke only works played straight, so the
     type is the label voice and nothing winks. */
  .ws-stage .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 2vw;
    padding: 1.6vh clamp(14px, 2.2vw, 48px);
    border-bottom: 1px solid var(--on-dark-10);
    flex: 0 0 auto;
  }
  .ws-stage .masthead .label {
    font-size: clamp(10px, 1.5vh, 22px);
    color: var(--on-dark-50);
    letter-spacing: 0.22em;
  }
  .ws-stage .masthead .label b {
    color: var(--on-dark-75);
    font-weight: 500;
  }
  .ws-stage #clock {
    font-family: var(--display);
    font-size: clamp(18px, 2.8vh, 42px);
    letter-spacing: -0.01em;
    color: var(--on-dark-50);
    font-variant-numeric: tabular-nums;
  }

  .ws-stage .centre {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2vh;
    padding: 1.5vh 0;
    min-height: 0;
  }

  /* ── The plate ──────────────────────────────────
     A real split-flap board is one object, and its blank flaps are
     part of it. The old board drew blanks in the same tone as the
     ground, so on dark the whole device dissolved and the two lines
     of text floated in nothing. The bezel and the inset shadow are
     what make 132 flaps read as one machine sitting in the room. */
  .ws-stage #flip-board {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: var(--gap);
    width: var(--board-w, 94vw);
    padding: calc(var(--cell) * 0.22);
    background: #000;
    border-radius: calc(var(--cell) * 0.1);
    box-shadow:
      0 0 0 1px var(--on-dark-10),
      0 calc(var(--cell) * 0.5) calc(var(--cell) * 1.6) rgba(0,0,0,0.85),
      inset 0 0 calc(var(--cell) * 0.8) rgba(0,0,0,0.9);
    flex: 0 0 auto;
  }

  .ws-stage .tile {
    aspect-ratio: var(--tile-ar);
    background: var(--dark);
    border-radius: calc(var(--cell) * 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--text);
    font-weight: 600;
    font-size: calc(var(--cell) * 0.62);
    line-height: 1;
    color: var(--on-dark);
    position: relative;
    overflow: hidden;
    box-shadow:
      inset 0 calc(var(--cell) * -0.03) 0 rgba(0,0,0,0.55),
      inset 0 calc(var(--cell) *  0.03) 0 rgba(255,255,255,0.045);
    will-change: transform;
  }

  /* the hinge — the detail that says split-flap and not spreadsheet */
  .ws-stage .tile::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: max(1px, calc(var(--cell) * 0.018));
    background: #000;
    opacity: 0.85;
    pointer-events: none;
  }

  /* The reveal is column-staggered, so flashing cardinal at the
     midpoint of each flip sends one red wave across the board.
     That is the whole showpiece and it costs a keyframe. */
  .ws-stage .tile.flipping { animation: ws-flip 0.18s ease-in-out; }

  @keyframes ws-flip {
    0%   { transform: scaleY(1); }
    50%  { transform: scaleY(0.04); background: var(--cardinal); color: var(--cardinal); }
    100% { transform: scaleY(1); }
  }

  /* ── Prompts ────────────────────────────────────
     Not board content — the facilitator's follow-ups. They get their
     own register so the plate stays pure mechanism: General Sans,
     left-aligned on a shared rule, each led by a cardinal marker.
     Colour is --on-dark-75, which measures 12.6:1 on this ground;
     the old #666660 measured 3.37:1 and failed AA. */
  .ws-stage #prompts-area {
    width: var(--board-w, 94vw);
    max-width: 94vw;
    display: flex;
    flex-direction: column;
    gap: 0.8vh;
    flex: 0 0 auto;
  }
  .ws-stage .prompt-item {
    font-family: var(--text);
    font-weight: 400;
    font-size: clamp(13px, 2.4vh, 34px);
    line-height: 1.45;
    color: var(--on-dark-75);
    padding-left: clamp(18px, 3.2vh, 46px);
    position: relative;
    opacity: 0;
    transform: translateY(0.8vh);
    transition: opacity .5s ease, transform .5s ease;
  }
  .ws-stage .prompt-item.visible { opacity: 1; transform: translateY(0); }
  .ws-stage .prompt-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.62em;
    width: clamp(10px, 1.8vh, 26px);
    height: max(2px, 0.28vh);
    background: var(--cardinal-lift);
  }

  /* ── Footer status ──────────────────────────────
     Carries the connection errors, so it is the line that most needs
     to be readable and used to be the least: 1.70:1. --on-dark-50 is
     7.4:1 here. The wording of the error strings is unchanged — it
     names which half of the link is missing, and that is load-bearing. */
  .ws-stage .footer {
    display: flex;
    align-items: center;
    gap: 1.2vh;
    padding: 1.4vh clamp(14px, 2.2vw, 48px);
    border-top: 1px solid var(--on-dark-10);
    flex: 0 0 auto;
  }
  .ws-stage #board-status {
    font-family: var(--text);
    font-weight: 500;
    font-size: clamp(10px, 1.4vh, 20px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--on-dark-50);
  }
  .ws-stage #board-status.alert { color: var(--cardinal-lift); }

  .ws-stage .lamp {
    width: clamp(7px, 1.1vh, 16px);
    height: clamp(7px, 1.1vh, 16px);
    border-radius: 50%;
    background: var(--on-dark-25);
    flex: 0 0 auto;
  }
  .ws-stage .lamp.live {
    background: var(--cardinal-lift);
    box-shadow: 0 0 1.2vh var(--cardinal-lift);
    animation: ws-pulse 2.4s ease-in-out infinite;
  }
  @keyframes ws-pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

  /* ── Audio unlock ───────────────────────────────
     Kept, because the flaps have to click and a browser will not make
     a sound until someone has clicked. Restyled so the thing a room
     sees before the workshop starts is a title card, not a dialog. */
  .ws-stage #unlock-overlay {
    position: fixed;
    inset: 0;
    background: var(--xdark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    z-index: 1000;
    cursor: pointer;
    text-align: center;
    padding: 6vw;
  }
  .ws-stage #unlock-overlay h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(38px, 7vw, 108px);
    letter-spacing: -0.02em;
    line-height: 1.02;
    color: var(--on-dark);
    margin: 0;
  }
  .ws-stage #unlock-overlay .rule {
    width: clamp(60px, 9vw, 140px);
    height: 3px;
    background: var(--cardinal-lift);
  }
  .ws-stage #unlock-overlay p {
    font-family: var(--text);
    font-weight: 500;
    font-size: clamp(11px, 1.1vw, 15px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--on-dark-50);
    margin: 0;
  }

  /* A board is pointed at a room, never at a phone. But a facilitator
     checks the link on one first, and a board that is unreadable there
     reads as broken. Below 640px the flaps would be under 25px wide,
     so the plate scrolls horizontally at a usable size rather than
     shrinking to nothing. */
  @media (max-width: 640px) {
    .ws.ws-stage { --board-w: 150vw; overflow-x: auto; }
    .ws-stage .centre { align-items: flex-start; }
  }
</style>
</head>
<body class="ws ws-stage">

<div id="unlock-overlay">
  <h2>Discussion Board</h2>
  <div class="rule"></div>
  <p>Click anywhere to start the board</p>
</div>

<header class="masthead">
  <div class="label">Dynamic Workshop <b>&middot; Discussion Board</b></div>
  <div id="clock">--:--</div>
</header>

<main class="centre">
  <div id="flip-board"></div>
  <div id="prompts-area"></div>
</main>

<footer class="footer">
  <span class="lamp" id="lamp"></span>
  <span id="board-status">Waiting for facilitator&hellip;</span>
</footer>

<script>
(function() {
  // Geometry is declared once, in CSS, and read back here. Two constants
  // that happen to agree is how a grid and its renderer drift apart.
  const stage = document.body;
  const readInt = (name, fallback) => {
    const v = parseInt(getComputedStyle(stage).getPropertyValue(name), 10);
    return Number.isFinite(v) ? v : fallback;
  };
  const ROWS = readInt('--rows', 6);
  const COLS = readInt('--cols', 22);

  const CHARSET = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,?!-:/\'';
  const FLIP_DELAY_PER_COL = 35; // ms stagger between columns
  const FLIPS_PER_TILE = 6;      // random chars before settling
  const FLIP_DURATION = 180;     // ms per flip animation

  let audioCtx = null;
  let audioUnlocked = false;
  let noiseBuf = null;

  const statusEl = document.getElementById('board-status');
  const lampEl   = document.getElementById('lamp');

  function setStatus(text, opts) {
    opts = opts || {};
    statusEl.textContent = text;
    statusEl.classList.toggle('alert', !!opts.alert);
    lampEl.classList.toggle('live', !!opts.live);
  }

  // ── Clock ──────────────────────────────────
  // The one piece of furniture that makes the plate read as a
  // departures board rather than a slide. Local time, no seconds —
  // a seconds digit on a wall display is a thing people watch.
  (function clock() {
    const el = document.getElementById('clock');
    function tick() {
      const d = new Date();
      el.textContent = String(d.getHours()).padStart(2, '0') + ':' +
                       String(d.getMinutes()).padStart(2, '0');
    }
    tick();
    setInterval(tick, 10000);
  })();

  // ── Unlock audio on click ──────────────────
  const overlay = document.getElementById('unlock-overlay');
  overlay.addEventListener('click', () => {
    // A failed AudioContext used to leave the overlay up forever, which
    // looks exactly like a dead board. The board works silently; the
    // overlay comes down either way.
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // One noise buffer, made once and replayed. A split-flap click is a
      // broadband transient, not a tone — the old square-wave oscillator
      // at a random pitch per flap read as a game, not a machine. 792
      // flips per reveal also makes per-flip oscillator creation worth
      // avoiding.
      const n = Math.floor(audioCtx.sampleRate * 0.05);
      noiseBuf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1);
      audioUnlocked = true;
    } catch {
      audioUnlocked = false;
    }
    overlay.style.transition = 'opacity 0.5s';
    overlay.style.opacity = '0';
    setTimeout(() => overlay.remove(), 500);
  });

  // ── Build the tile grid ────────────────────
  const board = document.getElementById('flip-board');
  const tiles = [];

  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = ' ';
      board.appendChild(tile);
      row.push(tile);
    }
    tiles.push(row);
  }

  // ── Sound ──────────────────────────────────
  function playClick() {
    if (!audioUnlocked || !audioCtx || !noiseBuf) return;
    try {
      const src  = audioCtx.createBufferSource();
      const bp   = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      src.buffer = noiseBuf;
      bp.type = 'bandpass';
      bp.frequency.value = 1400 + Math.random() * 900;
      bp.Q.value = 1.6;
      src.connect(bp); bp.connect(gain); gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.05, t);
      gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.045);
      src.start(t);
      src.stop(t + 0.05);
    } catch {}
  }

  // ── Flip a single tile ─────────────────────
  function flipTile(tile, targetChar, delay) {
    return new Promise((resolve) => {
      setTimeout(() => {
        let flipsLeft = FLIPS_PER_TILE;

        function nextFlip() {
          tile.classList.remove('flipping');
          void tile.offsetHeight; // reflow
          tile.classList.add('flipping');
          playClick();

          flipsLeft--;
          if (flipsLeft > 0) {
            tile.textContent = CHARSET[Math.floor(Math.random() * CHARSET.length)];
            setTimeout(nextFlip, FLIP_DURATION);
          } else {
            tile.textContent = targetChar;
            tile.classList.remove('flipping');
            resolve();
          }
        }
        nextFlip();
      }, delay);
    });
  }

  // ── Reveal text on board ───────────────────
  function reveal(text, prompts) {
    setStatus('Revealing', { live: true });

    // Word-wrap text into rows of COLS
    const words = text.toUpperCase().split(/\s+/);
    const rows = [];
    let currentRow = '';
    for (const word of words) {
      const candidate = currentRow ? currentRow + ' ' + word : word;
      if (candidate.length <= COLS) {
        currentRow = candidate;
      } else {
        // Only when there is something to push. A word longer than COLS as the
        // *first* word wraps against an empty currentRow, and that empty string
        // claims a row of the grid — a blank line above the truncated word, and
        // the whole block sitting one row low. Six rows is all a Vestaboard has.
        if (currentRow) rows.push(currentRow);
        currentRow = word;
      }
    }
    if (currentRow) rows.push(currentRow);

    // Over ROWS lines, the board shows part of a theme and says nothing
    // about it. Unchanged behaviour — it still truncates, because what to
    // do instead is a content decision — but the room is told.
    const overflowed = rows.length > ROWS;

    // Center each content row horizontally, truncate if over COLS
    const contentRows = rows.slice(0, ROWS).map(row => {
      const trimmed = row.trimEnd();
      // max(0): a word longer than COLS makes this negative, and String.repeat
      // throws RangeError on a negative count — which killed the whole reveal.
      const pad = Math.max(0, Math.floor((COLS - trimmed.length) / 2));
      return (' '.repeat(pad) + trimmed).padEnd(COLS, ' ').slice(0, COLS);
    });

    // Vertically center: offset content so it sits in the middle of the grid
    const rowOffset = Math.floor((ROWS - contentRows.length) / 2);
    const centeredRows = [];
    for (let r = 0; r < ROWS; r++) {
      const contentIdx = r - rowOffset;
      centeredRows.push(
        contentIdx >= 0 && contentIdx < contentRows.length
          ? contentRows[contentIdx]
          : ' '.repeat(COLS)
      );
    }

    // Column-staggered flip
    for (let c = 0; c < COLS; c++) {
      const colDelay = c * FLIP_DELAY_PER_COL;
      for (let r = 0; r < ROWS; r++) {
        const targetChar = centeredRows[r][c] ?? ' ';
        flipTile(tiles[r][c], targetChar, colDelay);
      }
    }

    // Show prompts after flip settles
    const maxDelay = COLS * FLIP_DELAY_PER_COL + FLIPS_PER_TILE * FLIP_DURATION;
    setTimeout(() => {
      showPrompts(prompts || []);
      setStatus(overflowed ? 'On the board · headline truncated' : 'On the board',
                { live: true, alert: overflowed });
    }, maxDelay + 300);
  }

  function showPrompts(prompts) {
    const area = document.getElementById('prompts-area');
    area.innerHTML = '';
    prompts.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'prompt-item';
      div.textContent = p;
      area.appendChild(div);
      setTimeout(() => div.classList.add('visible'), i * 200 + 100);
    });
  }

  // ── Clear board ─────────────────────────────
  function clearBoard() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        tiles[r][c].textContent = ' ';
        tiles[r][c].classList.remove('flipping');
      }
    }
    document.getElementById('prompts-area').innerHTML = '';
  }

  // ── WebSocket ────────────────────────────────
  // A board displays one session. Without this it was a wildcard listener, so a
  // reveal in any workshop lit up every connected display.
  const sessionId = new URLSearchParams(location.search).get('session') || '';
  // The session ID is also the public report URL, so it cannot be the board's
  // credential. The key comes with the link the console hands out.
  const boardKey = new URLSearchParams(location.search).get('key') || '';

  function connect() {
    if (!sessionId || !boardKey) {
      // Naming the missing half matters: an old bookmarked board URL has a
      // session and no key, and "no session" would send someone hunting for
      // the wrong thing. Either way the fix is to reopen it from the console.
      setStatus(
        (sessionId ? 'no board key' : 'no session') +
        ' — open this board from a session in the facilitator console',
        { alert: true });
      return;
    }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const base  = location.pathname.replace(/\/[^/]*$/, '');
    const ws    = new WebSocket(`${proto}//${location.host}${base}/ws?role=board&session=${encodeURIComponent(sessionId)}&key=${encodeURIComponent(boardKey)}`);

    ws.addEventListener('open', () => {
      setStatus('Connected · waiting for facilitator…', { live: true });
    });

    ws.addEventListener('message', (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'reveal') {
          clearBoard();
          reveal(msg.text, msg.prompts);
        }
      } catch {}
    });

    ws.addEventListener('close', (evt) => {
      // 1008 means the server refused this board — unknown session, or a
      // session whose board key has moved on. Reconnecting will keep failing,
      // so stop and say which it was rather than spin.
      if (evt.code === 1008) {
        setStatus(
          (evt.reason || 'refused').toLowerCase() +
          ' — reopen this board from the facilitator console',
          { alert: true });
        return;
      }
      setStatus('Reconnecting…', { alert: true });
      setTimeout(connect, 2000);
    });
  }

  connect();
})();
</script>
</body>
</html>
