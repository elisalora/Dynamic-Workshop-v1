<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Facilitator Console</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --surface2: #f1f3f7;
    --border: #dde1ea;
    --text: #1a1f2e;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent2: #d97706;
    --green: #16a34a;
    --orange: #ea580c;
    --purple: #7c3aed;
    --red: #dc2626;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 1rem;
    max-width: 860px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 0 1rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.25rem;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #conn-status {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .conn-dot.live { background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── Section headers ────────────────────────── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
  }
  .header-btns { display: flex; gap: 0.5rem; }

  .btn-new-group, .btn-new-workshop {
    border: none;
    border-radius: 5px;
    padding: 0.3rem 0.8rem;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: opacity 0.15s;
  }
  .btn-new-group { background: var(--accent); color: #fff; }
  .btn-new-group:hover { opacity: 0.85; }
  .btn-new-workshop { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-new-workshop:hover { background: #eff6ff; }

  /* ── Forms ──────────────────────────────────── */
  #groups-section { margin-bottom: 1.75rem; }
  #new-group-form, #new-workshop-form {
    display: none;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    padding: 1.1rem 1.1rem 1rem;
    margin-bottom: 0.75rem;
    animation: slideDown 0.2s ease-out;
  }
  #new-group-form.open, #new-workshop-form.open { display: block; }
  @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

  .form-row { margin-bottom: 0.85rem; }
  .form-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .form-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.55rem 0.75rem;
    font-size: 0.9rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .form-input:focus { outline: none; border-color: var(--accent); }

  #questions-list { display: flex; flex-direction: column; gap: 0.45rem; }
  .question-row { display: flex; gap: 0.4rem; align-items: center; }
  .question-row .form-input { flex: 1; }
  .btn-remove-q {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 28px; height: 28px;
    cursor: pointer;
    color: var(--muted);
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, color 0.1s;
  }
  .btn-remove-q:hover { background: #fee2e2; color: var(--red); border-color: #fca5a5; }
  .btn-add-q {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 5px;
    padding: 0.45rem 0.75rem;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    width: 100%;
    text-align: left;
    margin-top: 0.35rem;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-add-q:hover { border-color: var(--accent); color: var(--accent); }
  .form-actions { display: flex; gap: 0.5rem; margin-top: 0.85rem; align-items: center; }
  .btn-create {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 0.5rem 1.25rem;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-create:hover { opacity: 0.85; }
  .btn-create:disabled { opacity: 0.5; cursor: default; }
  .btn-cancel {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
  }
  .form-error { color: var(--red); font-size: 0.8rem; flex: 1; }

  /* ── Workshop folders ───────────────────────── */
  #workshops-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 0.5rem; }

  .workshop-folder {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .workshop-folder:has(.workshop-body.open) { border-color: #bfdbfe; }

  .workshop-header {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.75rem 0.85rem;
    cursor: pointer;
    user-select: none;
    background: #f8faff;
    transition: background 0.1s;
  }
  .workshop-header:hover { background: #eff6ff; }
  .workshop-chevron { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; transition: transform 0.18s; }
  .workshop-chevron.open { transform: rotate(90deg); }
  .workshop-name { font-weight: 700; font-size: 0.95rem; flex: 1; }
  .workshop-count {
    font-size: 0.68rem;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0.12rem 0.55rem;
    flex-shrink: 0;
  }
  .workshop-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }

  .btn-sm {
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    border-radius: 5px;
    padding: 0.28rem 0.65rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  .btn-sm:hover { background: var(--surface2); }
  .btn-sm-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-sm-primary:hover { opacity: 0.85; background: var(--accent); }
  .btn-sm-danger:hover { background: #fee2e2; color: var(--red); border-color: #fca5a5; }
  .btn-sm-summary { background: #eff6ff; color: var(--accent); border-color: #bfdbfe; }
  .btn-sm-summary:hover { background: #dbeafe; }
  .btn-sm-summary:disabled { opacity: 0.5; cursor: default; }

  .workshop-body { display: none; border-top: 1px solid var(--border); }
  .workshop-body.open { display: block; }
  .workshop-tables { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem 0.85rem; }
  .workshop-empty {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    font-style: italic;
    padding: 1rem;
  }
  .workshop-summary-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0 0.85rem 0.75rem;
    padding: 0.5rem 0.7rem;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 6px;
    font-size: 0.78rem;
    color: var(--green);
    cursor: pointer;
    transition: background 0.12s;
  }
  .workshop-summary-bar:hover { background: #dcfce7; }
  .workshop-summary-bar span { flex: 1; font-weight: 600; }
  .workshop-summary-bar .sum-date { font-weight: 400; font-size: 0.7rem; opacity: 0.75; }

  /* ── Subsection label (Unassigned) ──────────── */
  .subsection-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    padding: 0.4rem 0.1rem 0.3rem;
    margin-top: 0.5rem;
    margin-bottom: 0.4rem;
    border-top: 1px dashed var(--border);
  }

  /* ── Waiting session card ───────────────────── */
  .waiting-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    margin-bottom: 0.6rem;
    animation: slideDown 0.25s ease-out;
  }
  .waiting-card-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.7rem;
  }
  .waiting-name { font-weight: 700; font-size: 0.95rem; flex: 1; }
  .waiting-chip {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.18rem 0.5rem;
    border-radius: 100px;
    background: #fef3c7;
    color: var(--accent2);
    flex-shrink: 0;
  }
  .waiting-id {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: monospace;
    flex-shrink: 0;
  }
  .btn-delete-waiting {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.15rem 0.25rem;
    border-radius: 3px;
    flex-shrink: 0;
    transition: color 0.12s, background 0.12s;
  }
  .btn-delete-waiting:hover { color: var(--red); background: #fee2e2; }
  .waiting-questions { margin-bottom: 0.75rem; }
  .wq-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 0.3rem;
  }
  .wq-item {
    font-size: 0.8rem;
    color: var(--text);
    padding-left: 0.9rem;
    position: relative;
    line-height: 1.45;
    margin-bottom: 0.15rem;
  }
  .wq-item::before { content: '?'; position: absolute; left: 0; color: var(--accent); font-weight: 700; font-size: 0.65rem; top: 0.1em; }
  .link-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.65rem;
  }
  .link-url {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: monospace;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .btn-copy {
    flex-shrink: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.25rem 0.6rem;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-copy:hover { background: #dbeafe; border-color: var(--accent); color: var(--accent); }
  .btn-copy.copied { background: #dcfce7; border-color: var(--green); color: var(--green); }

  /* ── Active table cards ─────────────────────── */
  #tables-grid, .workshop-tables { display: flex; flex-direction: column; gap: 0.5rem; }

  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .table-card:hover { border-color: #93c5fd; }
  .table-card.expanded { border-color: var(--accent); }

  .table-card-summary {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.75rem 0.85rem;
  }
  .table-id {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
    flex-shrink: 0;
    max-width: 200px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .status-chip {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.2rem 0.55rem;
    border-radius: 100px;
    background: var(--surface2);
    color: var(--muted);
    flex-shrink: 0;
  }
  .status-chip.flowing    { background: #dcfce7; color: var(--green); }
  .status-chip.circling   { background: #ffedd5; color: var(--orange); }
  .status-chip.quiet      { background: var(--surface2); color: var(--muted); }
  .status-chip.converging { background: #ede9fe; color: var(--purple); }

  .sparkline-wrap {
    height: 26px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    flex-shrink: 0;
    width: 52px;
  }
  .spark-bar {
    flex: 1;
    background: var(--accent);
    opacity: 0.45;
    border-radius: 2px 2px 0 0;
    min-height: 2px;
  }
  .table-summary-text {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.4;
    font-style: italic;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .table-card.expanded .table-summary-text { white-space: normal; }
  .chevron {
    flex-shrink: 0;
    color: var(--muted);
    font-size: 0.7rem;
    transition: transform 0.2s;
  }
  .table-card.expanded .chevron { transform: rotate(180deg); }

  .table-detail {
    display: none;
    padding: 0 0.85rem 0.9rem;
    border-top: 1px solid var(--border);
    animation: slideDown 0.2s ease-out;
  }
  .table-card.expanded .table-detail { display: block; }

  .detail-section { margin-top: 0.85rem; }
  .detail-label {
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.4rem;
    font-weight: 600;
  }
  .cluster-block { margin-bottom: 0.6rem; }
  .cluster-name { font-weight: 600; font-size: 0.85rem; color: var(--accent); margin-bottom: 0.25rem; }
  .idea-row { font-size: 0.8rem; color: var(--text); padding-left: 0.9rem; line-height: 1.5; position: relative; }
  .idea-row::before { content: '–'; position: absolute; left: 0; color: var(--muted); }
  .quote-row { font-size: 0.8rem; font-style: italic; border-left: 2px solid var(--border); padding-left: 0.6rem; margin-bottom: 0.35rem; line-height: 1.4; }
  .flag-row { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--surface2); border-radius: 4px; padding: 0.2rem 0.55rem; font-size: 0.75rem; margin: 0.2rem 0.2rem 0 0; }
  .flag-kind { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .synthesis-row { font-size: 0.82rem; background: #eff6ff; border-left: 3px solid var(--accent); padding: 0.5rem 0.75rem; border-radius: 0 4px 4px 0; line-height: 1.5; }

  /* Pod link + archive row at bottom of expanded card */
  .card-bottom-actions {
    margin-top: 1rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .pod-link-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
  }
  .pod-link-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    flex-shrink: 0;
  }
  .pod-link-url {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: monospace;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  /* Assign-to-workshop select */
  .assign-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.85rem; }
  .assign-select {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.35rem 0.55rem;
    font-size: 0.8rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  .assign-select:focus { outline: none; border-color: var(--accent); }

  /* Archive button */
  .btn-archive {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.4rem 0.75rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    text-align: center;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .btn-archive:hover { background: #fff7ed; color: var(--orange); border-color: #fdba74; }

  /* ── Archived section ───────────────────────── */
  #archived-section { margin-top: 0.75rem; }
  .archived-toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    cursor: pointer;
    padding: 0.35rem 0.1rem;
    user-select: none;
    border-top: 1px dashed var(--border);
    margin-top: 0.5rem;
  }
  .archived-toggle:hover { color: var(--text); }
  .archived-toggle-chevron { transition: transform 0.18s; }
  .archived-toggle-chevron.open { transform: rotate(90deg); }
  .archived-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0.05rem 0.45rem;
    font-size: 0.62rem;
  }
  #archived-list { display: none; flex-direction: column; gap: 0.4rem; padding-top: 0.5rem; }
  #archived-list.open { display: flex; }

  .archived-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.65rem;
    opacity: 0.75;
  }
  .archived-name { font-weight: 600; font-size: 0.88rem; flex: 1; }
  .archived-summary-text { font-size: 0.76rem; color: var(--muted); font-style: italic; flex: 2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .btn-restore {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.25rem 0.65rem;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .btn-restore:hover { background: #dcfce7; border-color: var(--green); color: var(--green); }
  .btn-delete-archived {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 0.2rem 0.3rem;
    border-radius: 3px;
    transition: color 0.12s, background 0.12s;
  }
  .btn-delete-archived:hover { color: var(--red); background: #fee2e2; }

  /* ── Candidates ─────────────────────────────── */
  #candidates-section { margin-bottom: 1.75rem; }
  #candidates-list { display: flex; flex-direction: column; gap: 0.75rem; }

  .candidate-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; animation: fadeIn 0.3s ease-out; }
  .candidate-card.high { border-color: var(--accent2); }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; } }

  .cand-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .cand-topic { font-weight: 700; font-size: 0.95rem; flex: 1; }
  .conf-badge { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.15rem 0.5rem; border-radius: 100px; font-weight: 700; }
  .conf-badge.low    { background: #f1f3f7; color: var(--muted); }
  .conf-badge.medium { background: #ffedd5; color: var(--orange); }
  .conf-badge.high   { background: #fef3c7; color: var(--accent2); }

  .cand-rationale { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem; line-height: 1.4; }
  .evidence-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.7rem; }
  .evidence-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0.25rem 0.6rem; font-size: 0.7rem; }
  .evidence-chip .ev-table { color: var(--accent); font-weight: 700; margin-right: 0.3em; }
  .cand-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .btn { border: none; border-radius: 5px; padding: 0.4rem 0.85rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn-reveal  { background: var(--accent); color: #fff; }
  .btn-edit    { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-dismiss { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .no-candidates { color: var(--muted); font-size: 0.85rem; padding: 1rem 0; font-style: italic; }
  .candidate-card.revealed { opacity: 0.4; pointer-events: none; }
  .candidate-card.dismissed { display: none; }

  /* ── Summary modal ──────────────────────────── */
  dialog {
    border: none;
    border-radius: 12px;
    padding: 0;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    max-width: 740px;
    width: calc(100vw - 2rem);
    max-height: 85vh;
    overflow: hidden;
  }
  dialog::backdrop { background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); }
  dialog[open] { display: flex; flex-direction: column; }

  .modal-inner { display: flex; flex-direction: column; height: 100%; max-height: 85vh; }
  .modal-header {
    padding: 1.1rem 1.25rem 0.9rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    flex-shrink: 0;
  }
  .modal-header-text { flex: 1; }
  .modal-title { font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 0.2rem; }
  .modal-subtitle { font-size: 0.75rem; color: var(--muted); }
  .modal-close-x {
    background: none;
    border: none;
    font-size: 1.25rem;
    color: var(--muted);
    cursor: pointer;
    padding: 0.1rem 0.3rem;
    border-radius: 4px;
    flex-shrink: 0;
    transition: color 0.1s, background 0.1s;
  }
  .modal-close-x:hover { color: var(--text); background: var(--surface2); }
  #modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 1.1rem 1.25rem;
    color: var(--text);
    line-height: 1.65;
  }
  .modal-footer {
    padding: 0.85rem 1.25rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-shrink: 0;
  }
  .modal-footer-spacer { flex: 1; }
  .modal-generating {
    padding: 2.5rem;
    text-align: center;
    color: var(--muted);
    font-style: italic;
  }
  .modal-generating::before { content: '✦ '; animation: spin 2s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Rendered markdown in modal */
  .md h2 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
    margin: 1.2rem 0 0.45rem;
    padding-bottom: 0.25rem;
    border-bottom: 1px solid #dbeafe;
  }
  .md h2:first-child { margin-top: 0; }
  .md h3 { font-size: 0.9rem; font-weight: 700; margin: 0.9rem 0 0.3rem; color: var(--text); }
  .md p { margin-bottom: 0.55rem; font-size: 0.88rem; }
  .md ul { margin: 0.35rem 0 0.55rem 1.2rem; }
  .md li { font-size: 0.88rem; margin-bottom: 0.25rem; }
  .md strong { font-weight: 700; }
  .md blockquote {
    border-left: 3px solid var(--border);
    padding-left: 0.75rem;
    color: var(--muted);
    font-style: italic;
    margin: 0.5rem 0;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>Facilitator Console</h1>
  <div id="conn-status">
    <div class="conn-dot" id="conn-dot"></div>
    <span id="conn-text">Connecting…</span>
  </div>
</header>

<!-- ── Groups ──────────────────────────────────── -->
<section id="groups-section">
  <div class="section-header">
    <div class="section-title">Discussion Groups</div>
    <div class="header-btns">
      <button class="btn-new-workshop" id="btn-new-workshop">⊞ New Workshop</button>
      <button class="btn-new-group" id="btn-new-group">＋ New Group</button>
    </div>
  </div>

  <!-- New Workshop form -->
  <div id="new-workshop-form">
    <div class="form-row">
      <label class="form-label" for="workshop-name">Workshop name</label>
      <input class="form-input" id="workshop-name" type="text" placeholder="e.g. Innovation Sprint — Day 1" autocomplete="off"/>
    </div>
    <div class="form-actions">
      <button class="btn-create" id="btn-create-workshop">Create workshop</button>
      <button class="btn-cancel" id="btn-cancel-workshop">Cancel</button>
      <span class="form-error" id="form-error-workshop"></span>
    </div>
  </div>

  <!-- New Group form -->
  <div id="new-group-form">
    <div class="form-row">
      <label class="form-label" for="group-name">Group name</label>
      <input class="form-input" id="group-name" type="text" placeholder="e.g. Future of Work, Table 3…" autocomplete="off"/>
    </div>
    <div class="form-row">
      <div class="form-label">Discussion questions <span style="font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span></div>
      <div id="questions-list"></div>
      <button class="btn-add-q" id="btn-add-q">＋ Add a question</button>
    </div>
    <div class="form-actions">
      <button class="btn-create" id="btn-create">Create &amp; generate link</button>
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <span class="form-error" id="form-error"></span>
    </div>
  </div>

  <!-- Workshop folders -->
  <div id="workshops-list"></div>

  <!-- Waiting sessions (no workshop) -->
  <div id="waiting-list"></div>

  <!-- Unassigned active tables -->
  <div id="unassigned-section">
    <div class="subsection-label" id="unassigned-label" style="display:none">Unassigned</div>
    <div id="tables-grid"></div>
  </div>

  <!-- Archived -->
  <div id="archived-section" style="display:none">
    <div class="archived-toggle" id="archived-toggle">
      <span class="archived-toggle-chevron" id="archived-chevron">▶</span>
      <span>Archived</span>
      <span class="archived-badge" id="archived-count">0</span>
    </div>
    <div id="archived-list"></div>
  </div>
</section>

<!-- ── Spawn Candidates ─────────────────────────── -->
<section id="candidates-section">
  <div class="section-header">
    <div class="section-title">Spawn Candidates</div>
  </div>
  <div id="candidates-list"><p class="no-candidates">No cross-table themes detected yet.</p></div>
</section>

<!-- ── Summary modal ────────────────────────────── -->
<dialog id="summary-modal">
  <div class="modal-inner">
    <div class="modal-header">
      <div class="modal-header-text">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <button class="modal-close-x" id="modal-close-x">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-dismiss" id="modal-regen-btn">↺ Regenerate</button>
      <div class="modal-footer-spacer"></div>
      <button class="btn btn-reveal" id="modal-copy-btn">Copy as Markdown</button>
      <button class="btn btn-edit" id="modal-close-btn">Close</button>
    </div>
  </div>
</dialog>

<script>
(function() {
  const base = location.pathname.replace(/\/[^/]*$/, '');
  let ws = null;
  let currentWorkshops = [];
  let archivedOpen = false;

  // ── WebSocket ──────────────────────────────────────────
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}${base}/ws?role=console`);
    ws.addEventListener('open', () => {
      document.getElementById('conn-dot').className = 'conn-dot live';
      document.getElementById('conn-text').textContent = 'Live';
    });
    ws.addEventListener('message', (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'state') renderState(msg);
      } catch {}
    });
    ws.addEventListener('close', () => {
      document.getElementById('conn-dot').className = 'conn-dot';
      document.getElementById('conn-text').textContent = 'Reconnecting…';
      setTimeout(connect, 2000);
    });
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function apiFetch(path, method = 'POST', body = null) {
    return fetch(`${base}${path}`, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : null,
    });
  }

  // ── New Workshop form ──────────────────────────────────
  const wfForm    = document.getElementById('new-workshop-form');
  const wfNameEl  = document.getElementById('workshop-name');
  const wfErrEl   = document.getElementById('form-error-workshop');
  const btnNewWs  = document.getElementById('btn-new-workshop');

  btnNewWs.addEventListener('click', () => {
    const opening = !wfForm.classList.contains('open');
    wfForm.classList.toggle('open', opening);
    btnNewWs.textContent = opening ? '✕ Close' : '⊞ New Workshop';
    if (opening) {
      // close group form if open
      closeGroupForm();
      wfNameEl.focus();
    }
  });
  document.getElementById('btn-cancel-workshop').addEventListener('click', closeWorkshopForm);
  function closeWorkshopForm() {
    wfForm.classList.remove('open');
    btnNewWs.textContent = '⊞ New Workshop';
    wfNameEl.value = '';
    wfErrEl.textContent = '';
  }

  document.getElementById('btn-create-workshop').addEventListener('click', async () => {
    wfErrEl.textContent = '';
    const name = wfNameEl.value.trim();
    if (!name) { wfErrEl.textContent = 'Please enter a name.'; wfNameEl.focus(); return; }
    const res = await apiFetch('/workshops', 'POST', { name });
    if (!res.ok) { wfErrEl.textContent = 'Failed: ' + await res.text(); return; }
    closeWorkshopForm();
  });

  // ── New Group form ─────────────────────────────────────
  const form      = document.getElementById('new-group-form');
  const qList     = document.getElementById('questions-list');
  const btnToggle = document.getElementById('btn-new-group');
  const btnAdd    = document.getElementById('btn-add-q');
  const btnCreate = document.getElementById('btn-create');
  const btnCancel = document.getElementById('btn-cancel');
  const errEl     = document.getElementById('form-error');
  const nameEl    = document.getElementById('group-name');

  btnToggle.addEventListener('click', () => {
    const opening = !form.classList.contains('open');
    form.classList.toggle('open', opening);
    btnToggle.textContent = opening ? '✕ Close' : '＋ New Group';
    if (opening) { closeWorkshopForm(); nameEl.focus(); addQuestion(); }
  });

  btnCancel.addEventListener('click', closeGroupForm);
  function closeGroupForm() {
    form.classList.remove('open');
    btnToggle.textContent = '＋ New Group';
    nameEl.value = '';
    qList.innerHTML = '';
    errEl.textContent = '';
    btnCreate.disabled = false;
    btnCreate.textContent = 'Create & generate link';
  }

  btnAdd.addEventListener('click', () => addQuestion());
  function addQuestion(value = '') {
    const row = document.createElement('div');
    row.className = 'question-row';
    row.innerHTML = `
      <input class="form-input" type="text" placeholder="e.g. What assumptions are we making?" value="${esc(value)}" autocomplete="off"/>
      <button class="btn-remove-q" title="Remove">✕</button>`;
    row.querySelector('.btn-remove-q').addEventListener('click', () => row.remove());
    qList.appendChild(row);
    row.querySelector('input').focus();
  }

  btnCreate.addEventListener('click', async () => {
    errEl.textContent = '';
    const name = nameEl.value.trim();
    if (!name) { errEl.textContent = 'Please enter a group name.'; nameEl.focus(); return; }
    const questions = Array.from(qList.querySelectorAll('input')).map(i => i.value.trim()).filter(Boolean);
    btnCreate.disabled = true;
    btnCreate.textContent = 'Creating…';
    try {
      const res = await fetch(`${base}/sessions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, questions }),
      });
      if (!res.ok) throw new Error(await res.text());
      const session = await res.json();
      closeGroupForm();
      renderWaitingCard(session, document.getElementById('waiting-list'), true);
    } catch (e) {
      errEl.textContent = 'Failed: ' + e.message;
      btnCreate.disabled = false;
      btnCreate.textContent = 'Create & generate link';
    }
  });

  // ── Render state ───────────────────────────────────────
  const expandedIds = new Set();
  const expandedWorkshops = new Set();

  function renderState(state) {
    currentWorkshops = state.workshops || [];
    renderWorkshops(state.workshops || [], state.tables || []);
    renderWaitingSessions(state.waitingSessions || []);
    renderUnassigned(state.tables || [], state.workshops || []);
    renderCandidates(state.candidates || []);
    renderArchived(state.archivedTables || []);
  }

  // ── Workshop folders ───────────────────────────────────
  function renderWorkshops(workshops, allTables) {
    const list = document.getElementById('workshops-list');

    // Track which workshop folders exist
    const existingFolders = {};
    for (const el of list.querySelectorAll('.workshop-folder')) {
      existingFolders[el.dataset.workshopId] = el;
    }

    for (const w of workshops) {
      const wTables = allTables.filter(t => w.tableIds.includes(t.id));
      let folder = existingFolders[w.id];
      const isNew = !folder;
      if (isNew) {
        folder = document.createElement('div');
        folder.className = 'workshop-folder';
        folder.dataset.workshopId = w.id;
        list.appendChild(folder);
        if (!expandedWorkshops.has(w.id)) expandedWorkshops.add(w.id); // open by default
      }
      delete existingFolders[w.id];

      const isOpen = expandedWorkshops.has(w.id);
      const hasSummary = !!w.summary;

      folder.innerHTML = `
        <div class="workshop-header" data-action="toggle-ws" data-wsid="${esc(w.id)}">
          <span class="workshop-chevron ${isOpen ? 'open' : ''}">▶</span>
          <span class="workshop-name">${esc(w.name)}</span>
          <span class="workshop-count">${wTables.length} discussion${wTables.length !== 1 ? 's' : ''}</span>
          <div class="workshop-actions" onclick="event.stopPropagation()">
            ${hasSummary ? `<button class="btn-sm btn-sm-summary" data-action="view-summary" data-wsid="${esc(w.id)}" data-wsname="${esc(w.name)}">✦ View Summary</button>` : ''}
            <button class="btn-sm btn-sm-primary" data-action="gen-summary" data-wsid="${esc(w.id)}" data-wsname="${esc(w.name)}">${hasSummary ? '↺ Regenerate' : '✦ Create Summary'}</button>
            <button class="btn-sm" data-action="rename-ws" data-wsid="${esc(w.id)}" data-wsname="${esc(w.name)}">Rename</button>
            <button class="btn-sm btn-sm-danger" data-action="delete-ws" data-wsid="${esc(w.id)}" data-wsname="${esc(w.name)}">Delete</button>
          </div>
        </div>
        <div class="workshop-body ${isOpen ? 'open' : ''}">
          ${hasSummary ? `
            <div class="workshop-summary-bar" data-action="view-summary" data-wsid="${esc(w.id)}" data-wsname="${esc(w.name)}">
              <span>✦ Summary available</span>
              <span class="sum-date">${formatRelative(w.summaryGeneratedAt)}</span>
            </div>` : ''}
          <div class="workshop-tables" id="wt-${esc(w.id)}"></div>
          ${wTables.length === 0 ? '<div class="workshop-empty">No discussions assigned yet — use the Workshop dropdown on any discussion card.</div>' : ''}
        </div>`;

      // Render table cards inside the folder
      const tablesEl = folder.querySelector(`#wt-${w.id}`);
      if (tablesEl) renderTableCards(wTables, tablesEl);
    }

    // Remove folders for deleted workshops
    for (const el of Object.values(existingFolders)) el.remove();

    // Wire up folder actions
    list.onclick = (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const { action, wsid, wsname } = btn.dataset;
      if (action === 'toggle-ws') {
        if (expandedWorkshops.has(wsid)) expandedWorkshops.delete(wsid);
        else expandedWorkshops.add(wsid);
        renderWorkshops(currentWorkshops, /* need latest tables */ getLatestTables());
        return;
      }
      if (action === 'gen-summary') { openSummaryModal(wsid, wsname, true); return; }
      if (action === 'view-summary') { openSummaryModal(wsid, wsname, false); return; }
      if (action === 'rename-ws') {
        const newName = prompt('New workshop name:', wsname);
        if (newName?.trim()) apiFetch(`/workshops/${wsid}`, 'PATCH', { name: newName.trim() });
        return;
      }
      if (action === 'delete-ws') {
        if (confirm(`Delete workshop "${wsname}"? The discussions will become unassigned.`)) {
          apiFetch(`/workshops/${wsid}`, 'DELETE');
        }
        return;
      }
    };
  }

  // Store latest tables for re-renders triggered by UI state changes
  let _latestTables = [];
  function getLatestTables() { return _latestTables; }

  // ── Unassigned active tables ───────────────────────────
  function renderUnassigned(allTables, workshops) {
    _latestTables = allTables;
    const assignedIds = new Set(workshops.flatMap(w => w.tableIds));
    const unassigned = allTables.filter(t => !assignedIds.has(t.id));

    const label = document.getElementById('unassigned-label');
    const grid  = document.getElementById('tables-grid');

    // Show "Unassigned" label only if there are both workshops and unassigned tables
    label.style.display = (workshops.length > 0 && unassigned.length > 0) ? 'block' : 'none';

    renderTableCards(unassigned, grid);
  }

  // ── Render table cards into a container ───────────────
  function renderTableCards(tables, container) {
    const existing = {};
    for (const el of container.querySelectorAll('.table-card')) existing[el.dataset.id] = el;

    for (const t of tables) {
      let card = existing[t.id];
      const isNew = !card;
      if (isNew) {
        card = document.createElement('div');
        card.dataset.id = t.id;
        card.addEventListener('click', (e) => {
          if (e.target.closest('[data-action]') || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
          expandedIds.has(t.id) ? expandedIds.delete(t.id) : expandedIds.add(t.id);
          card.classList.toggle('expanded', expandedIds.has(t.id));
        });
        container.appendChild(card);
        // Remove from old waiting list if present
        const waitingCard = document.getElementById('waiting-list').querySelector(`[data-id="${t.id}"]`);
        if (waitingCard) waitingCard.remove();
      }
      delete existing[t.id];

      const m = t.metrics || {};
      const status = m.status || 'quiet';
      const wpmHistory = m.wpmHistory || [];
      const maxWpm = Math.max(...wpmHistory, 1);
      const board = t.board || { clusters:[], ideas:[], quotes:[], flags:[], synthesis:null };
      const isExpanded = expandedIds.has(t.id);
      const displayName = t.name || t.topic || t.id;
      const podUrl = `${location.origin}${base}/pod.html?table=${t.id}`;

      card.className = 'table-card' + (isExpanded ? ' expanded' : '');

      // Workshop assign select options
      const wsOptions = `<option value="">Unassigned</option>` +
        currentWorkshops.map(w =>
          `<option value="${esc(w.id)}" ${w.tableIds.includes(t.id) ? 'selected' : ''}>${esc(w.name)}</option>`
        ).join('') +
        `<option value="__new__">＋ Create new workshop…</option>`;

      const clusterHtml = board.clusters.length
        ? board.clusters.map(c => {
            const ideas = (board.ideas||[]).filter(i => i.clusterId === c.id);
            return `<div class="cluster-block">
              <div class="cluster-name">${esc(c.label)}</div>
              ${ideas.map(i => `<div class="idea-row">${esc(i.text)}</div>`).join('')}
            </div>`;
          }).join('')
        : '<span style="color:var(--muted);font-size:0.8rem;font-style:italic;">No clusters yet</span>';

      const quotesHtml = (board.quotes||[]).length
        ? board.quotes.map(q => `<div class="quote-row">"${esc(q.text)}"</div>`).join('') : '';
      const flagsHtml = (board.flags||[]).length
        ? board.flags.map(f => `<span class="flag-row"><span class="flag-kind">${esc(f.kind.replace(/_/g,' '))}</span>${esc(f.text)}</span>`).join('') : '';
      const synthesisHtml = board.synthesis
        ? `<div class="detail-section"><div class="detail-label">Synthesis</div><div class="synthesis-row">${esc(board.synthesis)}</div></div>` : '';
      const questionsHtml = (t.questions||[]).length
        ? `<div class="detail-section"><div class="detail-label">Discussion questions</div>${
            t.questions.map(q => `<div class="wq-item" style="padding-left:0.9rem;">${esc(q)}</div>`).join('')
          }</div>` : '';

      card.innerHTML = `
        <div class="table-card-summary">
          <div class="table-id">${esc(displayName)}</div>
          <div class="status-chip ${status}">${status}</div>
          <div class="sparkline-wrap">${
            Array.from({length:10}, (_,i) => {
              const v = wpmHistory[wpmHistory.length-10+i] ?? 0;
              const h = Math.round((v/maxWpm)*24)+2;
              return `<div class="spark-bar" style="height:${h}px"></div>`;
            }).join('')
          }</div>
          <div class="table-summary-text">${esc(t.summary || '(no summary yet)')}</div>
          <div class="chevron">▾</div>
        </div>
        <div class="table-detail">
          ${synthesisHtml}
          ${questionsHtml}
          <div class="detail-section">
            <div class="detail-label">Clusters &amp; Ideas</div>
            ${clusterHtml}
          </div>
          ${quotesHtml ? `<div class="detail-section"><div class="detail-label">Quotes</div>${quotesHtml}</div>` : ''}
          ${flagsHtml ? `<div class="detail-section"><div class="detail-label">Open Questions &amp; Flags</div>${flagsHtml}</div>` : ''}
          <div class="assign-row">
            <div class="detail-label" style="margin:0;flex-shrink:0;">Workshop</div>
            <select class="assign-select" data-action="assign-ws" data-tableid="${esc(t.id)}">${wsOptions}</select>
          </div>
          <div class="card-bottom-actions">
            <div class="pod-link-row">
              <span class="pod-link-label">Pod link</span>
              <span class="pod-link-url">${esc(podUrl)}</span>
              <button class="btn-copy" data-action="copy-link" data-url="${esc(podUrl)}">Copy link</button>
            </div>
            <button class="btn-archive" data-action="archive-table" data-tableid="${esc(t.id)}" data-name="${esc(displayName)}">⊡ Archive this discussion</button>
          </div>
        </div>`;
    }

    // Remove stale cards
    for (const el of Object.values(existing)) el.remove();

    // Wire up actions on this container
    container.onclick = (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const { action, tableid, url, name } = btn.dataset;
      if (action === 'copy-link') {
        copyText(url, btn);
        return;
      }
      if (action === 'archive-table') {
        if (confirm(`Archive "${name}"? The discussion data is preserved and can be restored.`)) {
          apiFetch(`/tables/${tableid}/archive`);
        }
        return;
      }
    };

    // Wire up assign-workshop selects
    for (const sel of container.querySelectorAll('select[data-action="assign-ws"]')) {
      sel.onchange = async () => {
        const tableId = sel.dataset.tableid;
        const wsId = sel.value;
        if (wsId === '__new__') {
          const newName = prompt('New workshop name:');
          if (newName?.trim()) {
            const res = await apiFetch('/workshops', 'POST', { name: newName.trim() });
            if (res.ok) {
              const newWs = await res.json();
              await apiFetch(`/workshops/${newWs.id}/assign/${tableId}`);
            }
          } else {
            sel.value = currentWorkshops.find(w => w.tableIds.includes(tableId))?.id ?? '';
          }
        } else if (wsId) {
          await apiFetch(`/workshops/${wsId}/assign/${tableId}`);
        } else {
          // Unassign from current workshop
          const curWs = currentWorkshops.find(w => w.tableIds.includes(tableId));
          if (curWs) await apiFetch(`/workshops/${curWs.id}/unassign/${tableId}`);
        }
      };
    }
  }

  // ── Waiting sessions ───────────────────────────────────
  const renderedWaiting = new Set();

  function renderWaitingSessions(sessions) {
    const list = document.getElementById('waiting-list');
    for (const el of list.querySelectorAll('.waiting-card')) {
      if (!sessions.find(s => s.tableId === el.dataset.id)) el.remove();
    }
    for (const s of sessions) {
      if (!list.querySelector(`[data-id="${s.tableId}"]`)) renderWaitingCard(s, list, false);
    }
  }

  function renderWaitingCard(session, container, prepend) {
    if (container.querySelector(`[data-id="${session.tableId}"]`)) return;
    const podUrl = `${location.origin}${base}/pod.html?table=${session.tableId}`;
    const card = document.createElement('div');
    card.className = 'waiting-card';
    card.dataset.id = session.tableId;

    const qHtml = (session.questions||[]).length
      ? `<div class="waiting-questions">
           <div class="wq-label">Discussion questions</div>
           ${session.questions.map(q => `<div class="wq-item">${esc(q)}</div>`).join('')}
         </div>` : '';

    card.innerHTML = `
      <div class="waiting-card-header">
        <div class="waiting-name">${esc(session.name)}</div>
        <div class="waiting-chip">Waiting for pod</div>
        <div class="waiting-id">${esc(session.tableId)}</div>
        <button class="btn-delete-waiting" title="Remove" data-id="${esc(session.tableId)}">✕</button>
      </div>
      ${qHtml}
      <div class="link-row">
        <span class="link-url">${esc(podUrl)}</span>
        <button class="btn-copy" data-url="${esc(podUrl)}">Copy link</button>
      </div>`;

    card.querySelector('.btn-copy').addEventListener('click', (e) => copyText(e.currentTarget.dataset.url, e.currentTarget));
    card.querySelector('.btn-delete-waiting').addEventListener('click', (e) => {
      const id = e.currentTarget.dataset.id;
      if (confirm('Remove this waiting session?')) {
        apiFetch(`/tables/${id}`, 'DELETE').then(() => card.remove());
      }
    });

    if (prepend && container.firstChild) container.insertBefore(card, container.firstChild);
    else container.appendChild(card);
  }

  // ── Archived section ───────────────────────────────────
  function renderArchived(archived) {
    const section = document.getElementById('archived-section');
    const list = document.getElementById('archived-list');
    const countEl = document.getElementById('archived-count');
    section.style.display = archived.length ? 'block' : 'none';
    countEl.textContent = archived.length;

    const existing = {};
    for (const el of list.querySelectorAll('.archived-card')) existing[el.dataset.id] = el;

    for (const t of archived) {
      if (!existing[t.id]) {
        const card = document.createElement('div');
        card.className = 'archived-card';
        card.dataset.id = t.id;
        card.innerHTML = `
          <div class="archived-name">${esc(t.name || t.id)}</div>
          <div class="archived-summary-text">${esc(t.summary || 'No summary')}</div>
          <button class="btn-restore" data-id="${esc(t.id)}">Restore</button>
          <button class="btn-delete-archived" data-id="${esc(t.id)}" title="Delete permanently">🗑</button>`;
        card.querySelector('.btn-restore').addEventListener('click', () => {
          apiFetch(`/tables/${t.id}/unarchive`);
        });
        card.querySelector('.btn-delete-archived').addEventListener('click', () => {
          if (confirm(`Permanently delete "${t.name || t.id}"? This cannot be undone.`)) {
            apiFetch(`/tables/${t.id}`, 'DELETE');
          }
        });
        list.appendChild(card);
      }
      delete existing[t.id];
    }
    for (const el of Object.values(existing)) el.remove();
  }

  // Archived toggle
  document.getElementById('archived-toggle').addEventListener('click', () => {
    archivedOpen = !archivedOpen;
    document.getElementById('archived-list').classList.toggle('open', archivedOpen);
    document.getElementById('archived-chevron').classList.toggle('open', archivedOpen);
  });

  // ── Candidates ─────────────────────────────────────────
  function renderCandidates(candidates) {
    const list = document.getElementById('candidates-list');
    const active = candidates.filter(c => c.state !== 'dismissed');
    if (!active.length) {
      list.innerHTML = '<p class="no-candidates">No cross-table themes detected yet.</p>';
      return;
    }
    const existing = {};
    for (const el of list.querySelectorAll('.candidate-card')) existing[el.dataset.id] = el;

    for (const c of active) {
      let card = existing[c.id];
      if (!card) { card = document.createElement('div'); card.dataset.id = c.id; list.appendChild(card); }
      delete existing[c.id];

      card.className = `candidate-card ${c.confidence === 'high' ? 'high' : ''} ${c.state}`;
      const evidenceChips = (c.evidence||[]).map(e =>
        `<div class="evidence-chip"><span class="ev-table">${esc(e.table)}</span>${esc(e.quote.slice(0,60))}…</div>`
      ).join('');
      card.innerHTML = `
        <div class="cand-header">
          <div class="cand-topic">${esc(c.topic)}</div>
          <div class="conf-badge ${c.confidence}">${c.confidence}</div>
        </div>
        <div class="cand-rationale">${esc(c.rationale)}</div>
        <div class="evidence-chips">${evidenceChips || '<span style="color:var(--muted);font-size:0.75rem;">No evidence yet</span>'}</div>
        <div class="cand-actions">
          ${c.state !== 'revealed' ? `
            <button class="btn btn-reveal" data-id="${esc(c.id)}" data-action="reveal">Reveal on board</button>
            <button class="btn btn-edit" data-id="${esc(c.id)}" data-action="edit">Edit + Reveal</button>
            <button class="btn btn-dismiss" data-id="${esc(c.id)}" data-action="dismiss">Dismiss</button>
          ` : '<span style="color:var(--muted);font-size:0.75rem;font-style:italic;">Revealed</span>'}
        </div>`;
    }
    for (const el of Object.values(existing)) el.remove();

    list.onclick = (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = btn.dataset.id, action = btn.dataset.action;
      if (action === 'reveal') send({ type: 'reveal', candidateId: id });
      else if (action === 'edit') { const t = prompt('Edit topic text:', id); if (t !== null) send({ type: 'reveal_custom', candidateId: id, text: t }); }
      else if (action === 'dismiss') send({ type: 'dismiss', candidateId: id });
    };
  }

  // ── Summary modal ──────────────────────────────────────
  const modal       = document.getElementById('summary-modal');
  const modalTitle  = document.getElementById('modal-title');
  const modalSub    = document.getElementById('modal-subtitle');
  const modalBody   = document.getElementById('modal-body');
  const modalCopyBtn = document.getElementById('modal-copy-btn');
  const modalRegenBtn = document.getElementById('modal-regen-btn');
  let _currentModalWsId = null;
  let _currentModalMd = '';

  document.getElementById('modal-close-x').addEventListener('click', () => modal.close());
  document.getElementById('modal-close-btn').addEventListener('click', () => modal.close());

  modalCopyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(_currentModalMd).then(() => {
      modalCopyBtn.textContent = '✓ Copied!';
      setTimeout(() => { modalCopyBtn.textContent = 'Copy as Markdown'; }, 2000);
    });
  });

  modalRegenBtn.addEventListener('click', () => {
    if (_currentModalWsId) openSummaryModal(_currentModalWsId, modalTitle.textContent, true);
  });

  function openSummaryModal(wsId, wsName, generate) {
    _currentModalWsId = wsId;
    _currentModalMd = '';
    modalTitle.textContent = wsName;
    modalBody.innerHTML = '';
    modal.showModal();

    const ws = currentWorkshops.find(w => w.id === wsId);
    if (!generate && ws?.summary) {
      // Show cached summary
      showSummaryInModal(ws.summary, ws.summaryGeneratedAt);
      return;
    }

    // Show generating state
    modalSub.textContent = 'Generating…';
    modalBody.innerHTML = '<div class="modal-generating">Scribe is reading all discussions and synthesising a report…</div>';
    modalRegenBtn.style.display = 'none';
    modalCopyBtn.style.display = 'none';

    apiFetch(`/workshops/${wsId}/summary`).then(async res => {
      if (!res.ok) {
        const errText = await res.text();
        modalBody.innerHTML = `<p style="color:var(--red);padding:1rem;">Failed to generate summary: ${esc(errText)}</p>`;
        modalSub.textContent = 'Error';
        return;
      }
      const { summary } = await res.json();
      showSummaryInModal(summary, Date.now());
    }).catch(err => {
      modalBody.innerHTML = `<p style="color:var(--red);padding:1rem;">Error: ${esc(err.message)}</p>`;
    });
  }

  function showSummaryInModal(markdown, generatedAt) {
    _currentModalMd = markdown;
    modalSub.textContent = generatedAt ? 'Generated ' + formatRelative(generatedAt) : '';
    modalBody.innerHTML = `<div class="md">${renderMarkdown(markdown)}</div>`;
    modalRegenBtn.style.display = '';
    modalCopyBtn.style.display = '';
  }

  // Minimal markdown → HTML (handles ##, ###, **, -, > blockquotes)
  function renderMarkdown(md) {
    const lines = md.split('\n');
    const out = [];
    let inList = false;
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) {
        if (inList) { out.push('</ul>'); inList = false; }
        continue;
      }
      if (line.startsWith('## ')) {
        if (inList) { out.push('</ul>'); inList = false; }
        out.push(`<h2>${mdInline(line.slice(3))}</h2>`);
      } else if (line.startsWith('### ')) {
        if (inList) { out.push('</ul>'); inList = false; }
        out.push(`<h3>${mdInline(line.slice(4))}</h3>`);
      } else if (line.startsWith('- ') || line.startsWith('* ')) {
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push(`<li>${mdInline(line.slice(2))}</li>`);
      } else if (line.startsWith('> ')) {
        if (inList) { out.push('</ul>'); inList = false; }
        out.push(`<blockquote>${mdInline(line.slice(2))}</blockquote>`);
      } else {
        if (inList) { out.push('</ul>'); inList = false; }
        out.push(`<p>${mdInline(line)}</p>`);
      }
    }
    if (inList) out.push('</ul>');
    return out.join('');
  }

  function mdInline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  // ── Utilities ──────────────────────────────────────────
  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
    });
  }

  function formatRelative(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
    return new Date(ts).toLocaleDateString();
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  connect();
})();
</script>
</body>
