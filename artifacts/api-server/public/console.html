<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Facilitator Console</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --surface2: #f1f3f7;
    --border: #dde1ea;
    --text: #1a1f2e;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent2: #d97706;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #ea580c;
    --purple: #7c3aed;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 1rem;
    max-width: 800px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 0 1rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.25rem;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #conn-status {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .conn-dot.live { background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── Section headers ─────────────────── */
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }

  /* ── Table cards ─────────────────────── */
  #tables-section { margin-bottom: 1.75rem; }
  #tables-grid {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .table-card:hover { border-color: var(--accent); }
  .table-card.expanded { border-color: var(--accent); }

  .table-card-summary {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
  }
  .table-id {
    font-weight: 700;
    font-size: 1rem;
    color: var(--text);
    flex-shrink: 0;
  }
  .status-chip {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.2rem 0.55rem;
    border-radius: 100px;
    background: var(--surface2);
    color: var(--muted);
    flex-shrink: 0;
  }
  .status-chip.flowing  { background: #dcfce7; color: var(--green); }
  .status-chip.circling { background: #ffedd5; color: var(--orange); }
  .status-chip.quiet    { background: var(--surface2); color: var(--muted); }
  .status-chip.converging { background: #ede9fe; color: var(--purple); }

  .sparkline-wrap {
    height: 28px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    flex-shrink: 0;
    width: 60px;
  }
  .spark-bar {
    flex: 1;
    background: var(--accent);
    opacity: 0.5;
    border-radius: 2px 2px 0 0;
    min-height: 2px;
  }

  .table-summary-text {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.4;
    font-style: italic;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .table-card.expanded .table-summary-text {
    white-space: normal;
  }

  .chevron {
    flex-shrink: 0;
    color: var(--muted);
    font-size: 0.75rem;
    transition: transform 0.2s;
  }
  .table-card.expanded .chevron { transform: rotate(180deg); }

  /* ── Expanded detail panel ───────────── */
  .table-detail {
    display: none;
    padding: 0 1rem 1rem;
    border-top: 1px solid var(--border);
    margin-top: 0;
    animation: slideDown 0.2s ease-out;
  }
  .table-card.expanded .table-detail { display: block; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .detail-section {
    margin-top: 0.85rem;
  }
  .detail-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.4rem;
    font-weight: 600;
  }
  .cluster-block {
    margin-bottom: 0.6rem;
  }
  .cluster-name {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--accent);
    margin-bottom: 0.25rem;
  }
  .idea-row {
    font-size: 0.8rem;
    color: var(--text);
    padding-left: 0.9rem;
    line-height: 1.5;
    position: relative;
  }
  .idea-row::before { content: '–'; position: absolute; left: 0; color: var(--muted); }

  .quote-row {
    font-size: 0.8rem;
    color: var(--text);
    font-style: italic;
    border-left: 2px solid var(--border);
    padding-left: 0.6rem;
    margin-bottom: 0.35rem;
    line-height: 1.4;
  }

  .flag-row {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--surface2);
    border-radius: 4px;
    padding: 0.2rem 0.55rem;
    font-size: 0.75rem;
    margin: 0.2rem 0.2rem 0 0;
  }
  .flag-kind {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
  }

  .synthesis-row {
    font-size: 0.82rem;
    background: #eff6ff;
    border-left: 3px solid var(--accent);
    padding: 0.5rem 0.75rem;
    border-radius: 0 4px 4px 0;
    line-height: 1.5;
    color: var(--text);
  }

  /* ── Candidates ──────────────────────── */
  #candidates-section { margin-bottom: 1.75rem; }
  #candidates-list { display: flex; flex-direction: column; gap: 0.75rem; }

  .candidate-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    animation: fadeIn 0.3s ease-out;
  }
  .candidate-card.high { border-color: var(--accent2); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .cand-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
  }
  .cand-topic {
    font-weight: 700;
    font-size: 0.95rem;
    flex: 1;
  }
  .conf-badge {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.15rem 0.5rem;
    border-radius: 100px;
    font-weight: 700;
  }
  .conf-badge.low    { background: #f1f3f7; color: var(--muted); }
  .conf-badge.medium { background: #ffedd5; color: var(--orange); }
  .conf-badge.high   { background: #fef3c7; color: var(--accent2); }

  .cand-rationale {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
    line-height: 1.4;
  }

  .evidence-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-bottom: 0.7rem;
  }
  .evidence-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.25rem 0.6rem;
    font-size: 0.7rem;
    color: var(--text);
  }
  .evidence-chip .ev-table {
    color: var(--accent);
    font-weight: 700;
    margin-right: 0.3em;
  }

  .cand-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .btn {
    border: none;
    border-radius: 5px;
    padding: 0.4rem 0.85rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn-reveal { background: var(--accent); color: #000; }
  .btn-edit   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-dismiss { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .no-candidates {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 1rem 0;
    font-style: italic;
  }

  .candidate-card.revealed { opacity: 0.4; pointer-events: none; }
  .candidate-card.dismissed { display: none; }
</style>
</head>
<body>

<header>
  <h1>Facilitator Console</h1>
  <div id="conn-status">
    <div class="conn-dot" id="conn-dot"></div>
    <span id="conn-text">Connecting…</span>
  </div>
</header>

<section id="tables-section">
  <div class="section-title">Tables</div>
  <div id="tables-grid"><p style="color:var(--muted);font-style:italic;font-size:0.85rem;">No tables connected yet.</p></div>
</section>

<section id="candidates-section">
  <div class="section-title">Spawn Candidates</div>
  <div id="candidates-list"><p class="no-candidates">No cross-table themes detected yet.</p></div>
</section>

<script>
(function() {
  let ws = null;
  let lastState = null;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const base  = location.pathname.replace(/\/[^/]*$/, '');
    ws = new WebSocket(`${proto}//${location.host}${base}/ws?role=console`);

    ws.addEventListener('open', () => {
      document.getElementById('conn-dot').className = 'conn-dot live';
      document.getElementById('conn-text').textContent = 'Live';
    });

    ws.addEventListener('message', (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'state') renderState(msg);
      } catch {}
    });

    ws.addEventListener('close', () => {
      document.getElementById('conn-dot').className = 'conn-dot';
      document.getElementById('conn-text').textContent = 'Reconnecting…';
      setTimeout(connect, 2000);
    });
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  // ── Tables ──────────────────────────────────────────────
  const expandedIds = new Set();

  function renderState(state) {
    renderTables(state.tables || []);
    renderCandidates(state.candidates || []);
  }

  function renderTables(tables) {
    const grid = document.getElementById('tables-grid');
    if (!tables.length) {
      grid.innerHTML = '<p style="color:var(--muted);font-style:italic;font-size:0.85rem;">No tables connected yet.</p>';
      return;
    }

    const existing = {};
    for (const el of grid.querySelectorAll('.table-card')) existing[el.dataset.id] = el;

    for (const t of tables) {
      let card = existing[t.id];
      const isNew = !card;
      if (isNew) {
        card = document.createElement('div');
        card.dataset.id = t.id;
        card.addEventListener('click', (e) => {
          if (e.target.closest('[data-action]')) return;
          if (expandedIds.has(t.id)) expandedIds.delete(t.id);
          else expandedIds.add(t.id);
          card.classList.toggle('expanded', expandedIds.has(t.id));
        });
        grid.appendChild(card);
      }
      delete existing[t.id];

      const m = t.metrics || {};
      const status = m.status || 'quiet';
      const wpmHistory = m.wpmHistory || [];
      const maxWpm = Math.max(...wpmHistory, 1);
      const board = t.board || { clusters: [], ideas: [], quotes: [], flags: [], synthesis: null };
      const isExpanded = expandedIds.has(t.id);

      card.className = 'table-card' + (isExpanded ? ' expanded' : '');

      // Build cluster detail HTML
      const clusterHtml = board.clusters.length
        ? board.clusters.map(c => {
            const ideas = (board.ideas || []).filter(i => i.clusterId === c.id);
            return `<div class="cluster-block">
              <div class="cluster-name">${esc(c.label)}</div>
              ${ideas.map(i => `<div class="idea-row">${esc(i.text)}</div>`).join('')}
            </div>`;
          }).join('')
        : '<span style="color:var(--muted);font-size:0.8rem;font-style:italic;">No clusters yet</span>';

      const quotesHtml = (board.quotes || []).length
        ? board.quotes.map(q => `<div class="quote-row">"${esc(q.text)}"</div>`).join('')
        : '';

      const flagsHtml = (board.flags || []).length
        ? board.flags.map(f => `<span class="flag-row"><span class="flag-kind">${esc(f.kind.replace(/_/g,' '))}</span>${esc(f.text)}</span>`).join('')
        : '';

      const synthesisHtml = board.synthesis
        ? `<div class="detail-section"><div class="detail-label">Synthesis</div><div class="synthesis-row">${esc(board.synthesis)}</div></div>`
        : '';

      card.innerHTML = `
        <div class="table-card-summary">
          <div class="table-id">Table ${esc(t.id)}</div>
          <div class="status-chip ${status}">${status}</div>
          <div class="sparkline-wrap">${
            Array.from({length: 10}, (_, i) => {
              const v = wpmHistory[wpmHistory.length - 10 + i] ?? 0;
              const h = Math.round((v / maxWpm) * 24) + 2;
              return `<div class="spark-bar" style="height:${h}px"></div>`;
            }).join('')
          }</div>
          <div class="table-summary-text">${esc(t.summary || '(no summary yet)')}</div>
          <div class="chevron">▾</div>
        </div>
        <div class="table-detail">
          ${synthesisHtml}
          <div class="detail-section">
            <div class="detail-label">Clusters &amp; Ideas</div>
            ${clusterHtml}
          </div>
          ${quotesHtml ? `<div class="detail-section"><div class="detail-label">Quotes</div>${quotesHtml}</div>` : ''}
          ${flagsHtml ? `<div class="detail-section"><div class="detail-label">Open Questions &amp; Flags</div>${flagsHtml}</div>` : ''}
        </div>`;
    }

    // Remove stale cards
    for (const el of Object.values(existing)) el.remove();
  }

  // ── Candidates ──────────────────────────────────────────
  function renderCandidates(candidates) {
    const list = document.getElementById('candidates-list');
    const active = candidates.filter(c => c.state !== 'dismissed');

    if (!active.length) {
      list.innerHTML = '<p class="no-candidates">No cross-table themes detected yet.</p>';
      return;
    }

    const existing = {};
    for (const el of list.querySelectorAll('.candidate-card')) existing[el.dataset.id] = el;

    for (const c of active) {
      let card = existing[c.id];
      if (!card) {
        card = document.createElement('div');
        card.dataset.id = c.id;
        list.appendChild(card);
      }
      delete existing[c.id];

      card.className = `candidate-card ${c.confidence === 'high' ? 'high' : ''} ${c.state}`;

      const evidenceChips = (c.evidence || []).map(e =>
        `<div class="evidence-chip"><span class="ev-table">${esc(e.table)}</span>${esc(e.quote.slice(0, 60))}…</div>`
      ).join('');

      card.innerHTML = `
        <div class="cand-header">
          <div class="cand-topic">${esc(c.topic)}</div>
          <div class="conf-badge ${c.confidence}">${c.confidence}</div>
        </div>
        <div class="cand-rationale">${esc(c.rationale)}</div>
        <div class="evidence-chips">${evidenceChips || '<span style="color:var(--muted);font-size:0.75rem;">No evidence yet</span>'}</div>
        <div class="cand-actions">
          ${c.state !== 'revealed' ? `
            <button class="btn btn-reveal" data-id="${esc(c.id)}" data-action="reveal">Reveal on board</button>
            <button class="btn btn-edit" data-id="${esc(c.id)}" data-action="edit">Edit + Reveal</button>
            <button class="btn btn-dismiss" data-id="${esc(c.id)}" data-action="dismiss">Dismiss</button>
          ` : '<span style="color:var(--muted);font-size:0.75rem;font-style:italic;">Revealed</span>'}
        </div>`;
    }

    for (const el of Object.values(existing)) el.remove();

    // Wire buttons (event delegation)
    list.onclick = (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (action === 'reveal') {
        send({ type: 'reveal', candidateId: id });
      } else if (action === 'edit') {
        const text = prompt('Edit topic text:', id);
        if (text !== null) send({ type: 'reveal_custom', candidateId: id, text });
      } else if (action === 'dismiss') {
        send({ type: 'dismiss', candidateId: id });
      }
    };
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  connect();
})();
</script>
</body>
</html>
