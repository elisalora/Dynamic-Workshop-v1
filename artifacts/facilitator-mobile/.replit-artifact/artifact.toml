kind = "mobile"
previewPath = "/mobile/"
title = "Facilitator Console"
version = "1.0.0"
id = "artifacts/facilitator-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 19451

[services.development]
run = "pnpm --filter @workspace/facilitator-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/facilitator-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/facilitator-mobile", "run", "serve" ]

[services.env]
PORT = "19451"
BASE_PATH = "/mobile/"
